# Sanitized local-only example. Replace paths with local values outside Git.
services:
  n8n:
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/host-writer;/data/factory-monitor
      - FACTORY_CURSOR_BRIDGE_TOKEN=${FACTORY_CURSOR_BRIDGE_TOKEN:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - DB_POSTGRESDB_POOL_SIZE=10
      - DB_POSTGRESDB_MAX_CONNECTION_LIFETIME_MS=300000
      - N8N_RUNNERS_TASK_ACCEPT_TIMEOUT=10
    volumes:
      - ./host-writer-runtime/inbox:/data/host-writer/inbox
      - ./host-writer-runtime/results:/data/host-writer/results:ro
      - ./ai-product-factory-v4/factory-infrastructure/monitor/telemetry:/data/factory-monitor
